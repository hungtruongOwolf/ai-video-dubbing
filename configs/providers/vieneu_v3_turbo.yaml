# Vietnamese voice-cloning TTS: VieNeu-TTS v3 Turbo (48 kHz, GPU batching + CUDA graphs).
# E1 (M4): 3x faster than OmniVoice, similar CER, but less like the speaker (ECAPA 0.52 vs
# 0.59) and slow (3.7 syllables/s), so OmniVoice stays the vi default. M8: cloning Chinese
# actors it carries far less of their accent (3.7% of lines heard as Chinese vs 22%), so the
# `accent-retry` route (configs/dub.yaml) voices with it the lines whose OmniVoice takes all
# sound foreign. Not in any chain: only that route (or --use) picks it.
id: vieneu_v3_turbo
op: [tts.synthesize]
runtime: http
env: tts2
impl: dub.providers.tts_vieneu:VieNeuTTS
impl_version: "1"
libs: [vieneu, transformers, torch]
status: active
# Loaded when the pod starts (with the other models): loaded on first use, the first lines
# of a job waited 130-196 s for the model, its graphs, the watermark and the denoiser.
preload: true
weights: {hf: pnnbao-ump/VieNeu-TTS-v3-Turbo}
params:
  model: pnnbao-ump/VieNeu-TTS-v3-Turbo
  temperature: 0.8
caps:
  langs: [vi, en]
  duration_control: none       # autoregressive: the timing ladder picks variants and stretches
  max_out_s: 30
  needs_ref_text: false
  sample_rate: 48000
limits: {max_concurrency: 1}
license: Apache-2.0
description: Vietnamese/English TTS with instant voice cloning (VieNeu-TTS v3 Turbo).
