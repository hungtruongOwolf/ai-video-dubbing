# Vietnamese speech-to-text: PhoWhisper-large (VinAI) converted to CTranslate2.
# Whisper large-v3 alone has a WER of ~40% on Vietnamese Common Voice; PhoWhisper is far better.
id: phowhisper_large_ct2
op: [asr.transcribe, asr.backcheck]
runtime: http
env: asr
worker: backcheck      # M10: its own process: back-checks no longer queue behind Whisper (language ID, source)
impl: dub.providers.asr_whisper:FasterWhisperASR
impl_version: "4"     # 2: space_before on words; 3: clips; 4: one back-check path (M10)
libs: [faster-whisper]
preload: false  # only needed for Vietnamese sources: load on first use, save VRAM
weights: {hf: kiendt/PhoWhisper-large-ct2, revision: abceb098c94235c16414dda9e1aada82ebcf6288}
params:
  model: kiendt/PhoWhisper-large-ct2
  revision: abceb098c94235c16414dda9e1aada82ebcf6288
  language: vi
  compute_type: float16
  beam_size: 5
caps: {langs: [vi]}
limits: {max_concurrency: 32, max_batch: 16}   # batches back-checks only
license: MIT (conversion); PhoWhisper is BSD-3-Clause
description: Vietnamese ASR with word timestamps.
