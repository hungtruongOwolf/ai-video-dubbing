# Sentence boundaries with SaT (wtpsplit), 85 languages, robust to missing punctuation.
id: sat_12l_sm
op: [text.boundaries]
runtime: http
env: tts                     # shares torch with OmniVoice (see pod/envs/tts.txt)
impl: dub.providers.boundaries_sat:SaTBoundaries
impl_version: "1"
libs: [wtpsplit, torch]
weights: {hf: segment-any-text/sat-12l-sm, revision: d70c72a9331b2d5a9e82baad00c64964a23a09bb}
params:
  model: segment-any-text/sat-12l-sm
  revision: d70c72a9331b2d5a9e82baad00c64964a23a09bb
  threshold: 0.25            # E4: macro F1 is flat over 0.2-0.4 (0.872); wtpsplit's default
  lang_threshold: {zh: 0.1}  # E4: lower is better for Chinese in both arms (speech +0.10)
limits: {max_concurrency: 1}
license: MIT
description: Segment any Text, 12 layers, trained for short and unpunctuated text.
