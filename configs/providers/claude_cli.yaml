# Translation with your Claude subscription through the Claude Code CLI (`claude -p`).
# Personal use only. See docs/claude-subscription.md.
id: claude_cli
op: [mt.context, mt.translate, mt.rewrite, text.boundaries, text.speakers]
runtime: inproc
impl: dub.providers.claude_cli:ClaudeCLI
requires_bin: [claude]
impl_version: "3"   # 2: cast speakers carry `characters` (merged voices); 3: required
params:
  model: sonnet                # alias of the current Sonnet model
  max_turns: 2                 # structured output counts as an extra turn
  timeout_s: 600
  reads_pauses: true           # text.boundaries: the request carries the pause after each word
  window_words: 400            # text.boundaries: words decided per call (plus 40 of context)
  window_lines: 300            # text.speakers: lines decided per call (plus 15 of context)
# Who says each line, read by a stronger model. On the zh drama (3 readings, voted; hand
# labels of 177 subtitle cues): speaker changes that change voice F1 sonnet 0.84, opus 0.88,
# fable 0.90; B-cubed F1 0.756 / 0.776 / 0.775; the readings agree on 71% / 93% of the lines.
# Translation stays on sonnet: three blind judges (opus, fable, sonnet) ranked the three
# models' Vietnamese lines even (mean rank 1.94-2.08, every pair 43-52%, 62 lines), and
# sonnet wrote the context + translation in 52 s against opus's 168 s.
op_params:
  text.speakers: {model: fable}
prompt_files:                  # prompt text is hashed into the cache key
  mt.context: mt_context.v2.md       # M10: names, aliases, motifs, name policy
  mt.translate: mt_translate.v2.md   # M10: dubbing style guide (meaning, mishearing, register, variants)
  mt.rewrite: mt_rewrite.v1.md
  text.boundaries: text_boundaries.v1.md
  text.speakers: text_speakers.v1.md
limits: {max_concurrency: 8}   # M5: rewrites of a 60-min final queue behind translation
on_error:
  usage_limit: pause_then_retry
  retry_wait_s: [60, 300]      # then give up; finished windows stay cached, rerun later
license: Claude subscription (personal use only)
description: Context pass (summary, glossary, cast sheet), window translation, shortening rewrites, who says each line.
