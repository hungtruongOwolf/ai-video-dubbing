# Speech-to-text for most source languages: Whisper large-v3 on CTranslate2 (faster-whisper).
id: whisper_large_v3
op: [asr.transcribe, asr.backcheck]
runtime: http
env: asr
impl: dub.providers.asr_whisper:FasterWhisperASR
impl_version: "3"     # 2: space_before on words; 3: clips
libs: [faster-whisper]
weights: {hf: Systran/faster-whisper-large-v3, revision: edaa852ec7e145841d8ffdb056a99866b5f0a478}
params:
  model: Systran/faster-whisper-large-v3
  revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
  compute_type: float16
  beam_size: 5
limits: {max_concurrency: 32, max_batch: 16}   # batches back-checks only
license: MIT
description: Multilingual ASR with word timestamps.
