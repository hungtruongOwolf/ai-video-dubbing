# Main configuration. This is the file you will edit most.
version: 1

profile: draft                 # CLI: --profile draft|final

# A tier only changes what happens AFTER the text layer (TTS chain, rewrites),
# so lines you fix in a draft survive the promotion to final.
profiles:
  # E9: OmniVoice at 16 steps is 1.9x faster than 32, with no measurable loss (CER, UTMOS).
  draft: {tts_chain: incumbent_only, llm_rewrite: false, max_rewrites: 0, params: {omnivoice: {num_step: 16}}}
  final: {tts_chain: langpack,       llm_rewrite: true,  max_rewrites: 2, takes: 3}

timing:
  variant_window: 0.08         # a variant predicted within ±8% of the slot "fits"
  safe_ratio: [0.85, 1.10]     # E3: exact engine at 0.85x-1.10x of the natural rate (CER rises beyond 1.1x)
  rate_p95: 1.10               # above this speed-up: rewrite (final) or flag "fast"
  rate_cap: 1.20               # hard ceiling: beyond it the unit is flagged "overflow"
  early_start_ms: 200
  late_end_ms: 500
  min_pause_ms: 120
  tail_guard_ms: 150
  strict: false

# QA gate for every dubbed take (see src/dub/ops/qa.py). Final renders try up to `takes` seeds.
qa:
  cer_max: 0.15                # back-check character error rate
  sim_ratio_min: 0.5           # voice similarity, relative to the speaker's own lines (E10: clones ~0.75)
  other_margin: 0.05           # fail when the take sounds more like another speaker
  voice_min_ms: 1200           # shorter takes are not judged on voice
  tail_min: 0.6                # share of the line's last quarter the ASR heard (truncation)

mix:
  bed_gain_db: 0.0
  loudness_lufs: -16.0
  match_level: true             # each line at the level of the original line (ops/level.py)
  level_max_dev_db: 10.0        # original level, at most this far from the speaker's median
  level_max_gain_db: 24.0       # the overall voice offset; per-line changes are bounded above

voice:
  audition: 4                  # reference clips tried per speaker (two test sentences each)
  audition_cer_slack: 0.05

translate:
  window_units: 12             # units per LLM call
  context_units: 3             # neighbouring units sent as context

# M5: units voiced at the same time. The GPU workers batch whatever is queued (continuous
# batching, up to each manifest's limits.max_batch), so this also bounds the TTS batch.
throughput:
  units_in_flight: 24

# Used when no rule matches and the langpack has no chain for the op.
# Real speech models arrive in M1; until then use --fake for those ops.
defaults:
  audio.separate: [mel_roformer]
  asr.transcribe: [whisper_large_v3]
  text.boundaries: [sat_12l_sm, punct_rules]
  audio.diarize:  [ecapa_cluster, single_speaker]
  audio.embed:    [ecapa_cluster]
  audio.voice_profile: [voice_agender]
  mt.context:     [claude_cli, llm_api]
  mt.translate:   [claude_cli, llm_api]
  mt.rewrite:     [claude_cli, llm_api]
  tts.synthesize: [omnivoice]

# First match wins; evaluated BEFORE the langpack chain.
# `use` replaces the candidates; `require` filters them by capability.
routes:
  tts.synthesize:
    - {id: short-line, when: {unit.slot_ms: {lt: 1300}}, require: {duration_control: exact}}
    - {id: weak-asr,   when: {unit.asr_conf: {lt: 0.6}}, require: {needs_ref_text: false}}
