# Main configuration. This is the file you will edit most.
version: 1

profile: draft                 # CLI: --profile draft|final

# A tier only changes what happens AFTER the text layer (TTS chain, rewrites),
# so lines you fix in a draft survive the promotion to final.
profiles:
  # E9: OmniVoice at 16 steps is 1.9x faster than 32, with no measurable loss (CER, UTMOS).
  draft: {tts_chain: incumbent_only, llm_rewrite: false, max_rewrites: 0, params: {omnivoice: {num_step: 16}}}
  final: {tts_chain: langpack,       llm_rewrite: true,  max_rewrites: 2, takes: 3}

timing:
  variant_window: 0.08         # a variant predicted within ±8% of the slot "fits"
  safe_ratio: [0.85, 1.10]     # E3: exact engine at 0.85x-1.10x of the natural rate (CER rises beyond 1.1x)
  rate_p95: 1.10               # above this speed-up: rewrite (final) or flag "fast"
  rate_cap: 1.20               # hard ceiling: beyond it the unit is flagged "overflow"
  early_start_ms: 200
  late_end_ms: 500
  min_pause_ms: 120
  tail_guard_ms: 150
  strict: false
  phrase_align: true           # M11: the take pauses where its actor pauses (ops/phrases.py)
  phrase_pause_ms: 250         # the actor's pauses shorter than this are not pauses
  phrase_rate: [0.87, 1.15]    # how much a piece of the take may be slowed down / sped up

# QA gate for every dubbed take (see src/dub/ops/qa.py). Final renders try up to `takes` seeds.
qa:
  cer_max: 0.15                # back-check character error rate
  sim_ratio_min: 0.5           # voice similarity, relative to the speaker's own lines (E10: clones ~0.75)
  other_margin: 0.05           # fail when the take sounds more like another speaker
  twin_sim: 0.8                # ...unless that speaker's voice centroid is this close (similar voices)
  source_lid: true             # M8: fail a take Whisper hears as the source language (an accent)
  lid_min_ms: 1500             # ...when it is long enough for language identification
  voice_min_ms: 1200           # shorter takes are not judged on voice
  tail_min: 0.6                # share of the line's last quarter the ASR heard (truncation)

mix:
  bed_gain_db: 0.0
  loudness_lufs: -16.0
  match_level: true             # each line at the level of the original line (ops/level.py)
  level_max_dev_db: 10.0        # original level, at most this far from the speaker's median
  level_max_gain_db: 24.0       # the overall voice offset; per-line changes are bounded above

voice:
  # Reference clips tried per speaker (two test sentences each); 1 = off. M7: on the 60-min
  # speech the audition picked clip 4 of 4 (+0.07 on the test sentences) but the whole job's
  # voice similarity did not move (0.599 -> 0.600): off until a source with uneven clips shows a gain.
  audition: 1
  audition_cer_slack: 0.05
  # M12: each line voiced from the speaker's clean clip (2-10 s) whose delivery (pitch, pitch
  # range, level, voicing) is closest to the line's own (ops/prosody.py); retakes use the usual
  # reference. A pool clip only when it is closer than the usual one by style_margin (z units).
  emotion_refs: true
  styles: 12
  style_margin: 0.5
  # M13: "closest delivery" by prosody, emotion (emotion2vec+ embeddings) or both. A/B on the
  # drama: both keeps prosody's pitch agreement (0.45 vs 0.46) and adds emotion agreement
  # (0.17 -> 0.24) without a new QA failure; emotion alone failed 3 more lines.
  style_by: both
  style_margin_rel: 0.25       # emotion / both: a clip must beat the usual one by this (median units)

# Who says each line: the LLM reads the script this many times (concurrently) and each line
# goes to the character most readings give it; lines the readings disagree on are flagged.
speakers:
  votes: 3

translate:
  window_units: 12             # units per LLM call
  context_units: 3             # neighbouring units sent as context

# M5: units voiced at the same time. The GPU workers batch whatever is queued (continuous
# batching, up to each manifest's limits.max_batch), so this also bounds the TTS batch.
throughput:
  # M10 A/B on the drama's cached translations (voicing only): 24 in flight, retakes one after
  # another 74.5 s; 24 at once 77.6 s; 48 one after another 79.2 s; 48 at once 93.2 s. More work
  # queued only lengthened the queues of the single-runner workers. The code before M10 took
  # 87.8 s on the same lines with far fewer back-checks to compute (cached).
  units_in_flight: 24
  parallel_retakes: false

# Used when no rule matches and the langpack has no chain for the op.
# Real speech models arrive in M1; until then use --fake for those ops.
defaults:
  audio.separate: [mel_roformer]
  asr.transcribe: [whisper_large_v3]
  text.boundaries: [sat_12l_sm, punct_rules]
  audio.diarize:  [ecapa_cluster, single_speaker]
  audio.embed:    [ecapa_cluster]
  audio.voice_profile: [voice_agender]
  audio.emotion:  [emotion2vec_plus]   # M13: emotion embeddings (voices by delivery, agreement)
  mt.context:     [claude_cli, llm_api]
  mt.translate:   [claude_cli, llm_api]
  mt.rewrite:     [claude_cli, llm_api]
  text.speakers:  [claude_cli]     # M8: who says each line (read from the script)
  tts.synthesize: [omnivoice]

# First match wins; evaluated BEFORE the langpack chain.
# `use` replaces the candidates; `require` filters them by capability.
routes:
  tts.synthesize:
    # M8: a line whose every take carries the actor's accent (heard as the source language
    # by the QA gate) gets one take from VieNeu: 3.7% of a zh drama's lines heard as Chinese
    # against OmniVoice's 22% (18% best of 3), voice likeness 0.51 vs 0.53 (experiments/accent.py)
    - {id: accent-retry, when: {take.accent_retry: true}, use: [vieneu_v3_turbo]}
    # A line whose every take failed the QA gate gets one take from OmniVoice (when another
    # engine voiced it): VieNeu read "Không hứng" as "không hơn" in 9 takes of 9.
    - {id: qa-retry, when: {take.qa_retry: true}, use: [omnivoice]}
    # M8: Vietnamese lines of up to 6 syllables, understood (CER <= 0.15) by the back-check
    # with VieNeu 64% of the time against OmniVoice's 35% at 1.6x its linear length (6 voices
    # of a zh drama x 12 lines, experiments/short_lines.py --engine vieneu); 3 syllables 83%
    # vs 17%. VieNeu also says them shorter (4-6 syllables in 0.9-1.5 s).
    # M10: only in slots up to 1.6 s. VieNeu has no length control: in longer slots its short
    # lines filled under 70% of the slot (24 of the drama's 90 lines outside 0.7-1.2), while
    # OmniVoice plans them at 1.6x their linear length (understood 96% at 4-6 syllables, M8).
    - {id: short-line-vi, when: {tgt_lang: vi, line.units: {lte: 6}, unit.slot_ms: {lte: 1600}}, use: [vieneu_v3_turbo]}
    - {id: short-line, when: {unit.slot_ms: {lt: 1300}}, require: {duration_control: exact}}
    - {id: weak-asr,   when: {unit.asr_conf: {lt: 0.6}}, require: {needs_ref_text: false}}
