lang: zh
name: Chinese
iso639_2: zho
speech_unit: char              # one character = one syllable in Mandarin
units_per_s: 4.6               # E7: confirmed for OmniVoice
joiner: ""
segment: {max_unit_s: 15, target_unit_s: 7, min_unit_s: 1.0, hard_pause_s: 1.5}
subs: {cpl: 16, cps: 9, max_lines: 2}
chains:
  asr.transcribe: [whisper_large_v3]
  tts.synthesize: [omnivoice]
# Voice calibration: the silence a TTS adds inside the requested length (per voice).
calibration:
  - "今天天气很好，我们一起去散步吧。"
  - "谢谢大家听我讲这个故事。"
# Laughter, cries and fillers (哈哈, 啊, 嗯, 哎呀): such a line keeps its original audio.
# Not 喂 (hello), 好/对 (yes) or 阿 (a name prefix: 阿元).
interjections: '[哈呵嘿嘻啊呀哎哟唉嗯哦噢喔呃咦哇呜嗷]+'
