lang: en
name: English
iso639_2: eng
speech_unit: syllable
units_per_s: 4.2               # E7: confirmed for OmniVoice
joiner: " "
segment: {max_unit_s: 15, target_unit_s: 7, min_unit_s: 1.0, hard_pause_s: 1.5}
subs: {cpl: 42, cps: 17, max_lines: 2}
chains:
  asr.transcribe: [whisper_large_v3]
  tts.synthesize: [omnivoice]
# Voice calibration: the silence a TTS adds inside the requested length (per voice).
calibration:
  - "The weather is lovely today, so let's go for a walk."
  - "Thank you all for listening to this story."
# Laughter, cries and fillers (haha, oh, uh-huh, hmm): such a line keeps its original
# audio. Not hi/hey/yes/no: words to translate.
interjections: '(?:o+h+|a+h+|u+h+|u+m+|h+m+|m+h*m+|e+h+|h+u+h+|(?:ha)+h?|(?:he)+h?|w+o+w+|w+h+o+a+|o+w+|o+u+c+h+|u+g+h+|a+w+|o+o+p+s+|a+r+g+h+)+'
