# Vietnamese. Adding a language = adding a file like this one.
lang: vi
name: Vietnamese
iso639_2: vie
speech_unit: syllable          # every Vietnamese word is one syllable
units_per_s: 4.7               # E7: OmniVoice (cross-lingual clone) loses words above ~4.7 syl/s
joiner: " "
# M8 (experiments/short_lines.py, 6 voices x 12 lines): lines of 4-6 syllables were understood
# 67% of the time at the average rate, 96% at 1.6x, 75% at 2x; 2-3 syllables 19% -> 31-33%
# from 1.3x on. Short lines are planned 1.6x longer, fading to 1x at 12 syllables.
short_boost: 1.6
short_units: 6
segment: {max_unit_s: 15, target_unit_s: 7, min_unit_s: 1.0, hard_pause_s: 1.5}
subs: {cpl: 42, cps: 17, max_lines: 2}
# Generic pronouns: wrong when the cast sheet gives kinship terms (ông/cháu, mẹ/con, anh/em...).
address_generic: [tôi, tao, tớ, mày, cậu, bạn]   # not mình/ta: also "we/our" (nhà mình)
chains:
  # M7: PhoWhisper's words + Whisper large-v3's punctuation where both heard the same words:
  # sentence F1 0.687 -> 0.779 on 8 videos (7 better, 1 worse). E6 (M4): Whisper alone
  # invents sentences on hard audio, so its words are never used.
  asr.transcribe: [phowhisper_punct, phowhisper_large_ct2, whisper_large_v3]
  asr.backcheck: [phowhisper_large_ct2, whisper_large_v3]   # words only, batched (M5)
  tts.synthesize: [omnivoice]                                # E1 (M4): kept over VieNeu-TTS (voice similarity, rate)
# Voice calibration: the silence a TTS adds inside the requested length (per voice).
calibration:
  - "Hôm nay trời rất đẹp, chúng ta cùng đi dạo nhé."
  - "Cảm ơn mọi người đã lắng nghe câu chuyện này."
# Laughter, cries and fillers (haha, ôi, á): such a line keeps its original audio.
# Not ừ/vâng/dạ (yes): words to translate.
interjections: '(?:ha+|hi+|hì+|he+|hê+|há+|ô+|ồ+|ố+|ôi+|ối+|a+|à+|á+|ơ+|ờ+|ớ+|ui+|úi+|chà+|ủa+)+'
# Final particles the back-check swaps with no change of meaning (dub.ops.qa.fold_particles):
# question particles, and the softening "nhé" with its southern forms. Not "ạ" (politeness).
final_particles:
  - [à, ư, hả, hở, á, hử]
  - [nhé, nha, nhá]
