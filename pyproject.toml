[project]
name = "ai-video-dubbing"
version = "0.1.0"
description = "Multilingual AI video dubbing pipeline (personal learning project)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "budoux>=0.7",
    "pythainlp>=5.0",
]

[project.scripts]
dub = "dub.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "opencc-python-reimplemented==0.1.7",  # dub bench seg: zh in simplified characters
]
# Laptop side: read subtitles burned into the picture (dub.hardsubs_ocr). Not needed on the pod.
ocr = [
    "rapidocr-onnxruntime==1.4.4",
    "pillow>=10",
]

# Laptop side: `dub get` / `dub run URL` download videos from links (dub.fetch). yt-dlp
# follows the sites closely: when a site stops working, upgrade it
# (`uv lock --upgrade-package yt-dlp`). curl-cffi lets it look like a browser (TikTok).
fetch = [
    "yt-dlp[default,curl-cffi]==2026.10.26",
]

[tool.uv]
default-groups = ["dev", "ocr", "fetch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
